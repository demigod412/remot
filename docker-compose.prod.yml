# Production stack. STANDALONE — use it on its own, never with -f docker-compose.yml:
#
#   docker compose -f docker-compose.prod.yml up -d
#
# WHY STANDALONE RATHER THAN AN OVERLAY
#
# This started life as an overlay meant to be combined with the base file. That was
# wrong, and the way it was wrong is worth recording: Compose MERGES `ports` lists
# across files, it does not replace them. Combining the two gave db BOTH
# "3306:3306" and "127.0.0.1:3306:3306". The first bound 0.0.0.0, the second then
# failed with "address already in use" — and the visible symptom was a container
# that would not start, while the actual consequence was that MySQL stayed exposed
# to the internet exactly as before. A security fix that appears to work and does
# not is worse than no fix.
#
# nginx had the same problem, keeping the development "8000:80" alongside 80 and 443.
#
# One complete file has no merge semantics to reason about. What you read is what runs.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: app
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
    working_dir: /var/www
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    # 80 and 443 only. No 8000: that is a development convenience and on a public
    # box it is a third door onto the same app, bypassing the redirect to HTTPS.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-laravel}"
      MYSQL_USER: "${DB_USERNAME:-laravel}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in ./.env}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in ./.env}"
    # NOT PUBLISHED. Nothing outside this network needs the port — the app reaches
    # MySQL as db:3306 internally. To get a shell or take a dump:
    #   docker compose -f docker-compose.prod.yml exec db mysql -ularavel -p laravel
    #   docker compose -f docker-compose.prod.yml exec db mysqldump ... > backup.sql
    # Publishing it, even on 127.0.0.1, only creates a port to collide with.
    expose:
      - "3306"
    volumes:
      - db_data:/var/lib/mysql
    command:
      # Tuned for a 2 GB instance shared with PHP and nginx. The defaults plus
      # mysqld's baseline are enough to invite the OOM killer during an asset build.
      - --innodb-buffer-pool-size=256M
      - --max-connections=60
      - --performance-schema=OFF
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - laravel

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: scheduler
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
    working_dir: /var/www
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel
    entrypoint: >
      sh -c "while true; do php artisan schedule:run >> /dev/null 2>&1; sleep 60; done"

networks:
  laravel:
    driver: bridge

volumes:
  db_data:
