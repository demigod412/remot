# Origin server config for use behind Cloudflare.
#
# Cloudflare terminates the visitor's TLS and opens a second TLS connection to here
# using the Origin CA certificate installed by install.sh. Set SSL/TLS mode to
# "Full (strict)" in the Cloudflare dashboard so that hop is verified.

# Plain HTTP: redirect. Cloudflare will normally speak HTTPS to the origin, but a
# direct hit on port 80 should not serve the app in the clear.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let the health check through unencrypted so uptime probes work.
    location = /up { proxy_pass http://app:9000; }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/public;
    index index.php;

    client_max_body_size 24M;   # task package zips and KYC uploads

    # The app sets its own security headers via middleware; these cover static files
    # served straight by nginx, which never reach PHP.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploads live under storage/ and are served through SecureFileController so
    # that KYC documents and CVs are access-checked. Never expose them directly.
    location ^~ /storage/app/ { deny all; return 404; }
    location ~ /\.(?!well-known) { deny all; return 404; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 512;
}
